# The game outside Windows: build the two search libraries with the platform's own compiler and run the self-test
# (wotr_bridge/selftest.py: the library and the Python engine must pick the same move on saved positions; the turn
# search must answer).  No game client is started.  Windows ships its libraries prebuilt and is checked before a release.
name: platforms
on:
  push:
  workflow_dispatch:
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          python -m pip install --upgrade pip
          if [ "$(uname)" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt
      - name: Build the search libraries
        run: |
          python -B native_backend/live_search_oct19/build_portable.py
          python -B turn_search/native_w2x/box/build_portable.py
      - name: The AI server starts
        run: python -B wotr_bridge/play.py --self-check
      - name: Both searches on saved positions
        run: python -B wotr_bridge/selftest.py --out selftest_${{ matrix.os }}.json
      - name: Keep what was built and logged
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: |
            selftest_*.json
            native_backend/live_search_oct19/platform/**/manifest.json
            native_backend/live_search_oct19/platform/**/build.log
            turn_search/native_w2x/box/platform/**/manifest.json
            turn_search/native_w2x/box/platform/**/build.log
            turn_search/turn_search_service.log
            wotr_bridge/play_client/ai_server_console.log
